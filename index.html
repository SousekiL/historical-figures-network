<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>历代历史文化名人关系网络</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <!-- 顶栏 -->
  <header id="topbar">
    <div id="title-block">
      <h1 id="title">历代历史文化名人关系网络</h1>
      <p id="subtitle">数据来源：CBDB 中国历代人物传记资料库 · 关系主网络</p>
    </div>
    <div id="search-wrap">
      <input id="search" type="search" placeholder="搜索人物姓名 / 字 / 号…" autocomplete="off">
    </div>
    <div id="stats" class="info-panel">
      <div class="stat"><span class="stat-num" id="stat-people">–</span><span class="stat-label">人物</span></div>
      <div class="stat"><span class="stat-num" id="stat-edges">–</span><span class="stat-label">关系</span></div>
      <div class="stat"><span class="stat-num" id="stat-dynasties">–</span><span class="stat-label">朝代</span></div>
    </div>
    <button id="theme-toggle" class="chip chip-action" type="button" aria-label="切换明暗主题">暗色</button>
  </header>

  <!-- 朝代筛选 + 标签滑杆 -->
  <div id="filter-bar">
    <span class="filter-label">朝代：</span>
    <div id="dynasty-chips"></div>
    <div id="label-slider-wrap" title="标签显示密度（按中心度）">
      <span class="filter-label">标签：</span>
      <input type="range" id="label-slider" min="0" max="5" step="1" value="2" aria-label="标签显示密度">
      <span id="label-slider-val">较少</span>
    </div>
    <button id="reset-view" class="chip chip-action" type="button">重置视图</button>
  </div>

  <!-- 关系类型筛选 -->
  <div id="rel-filter-bar">
    <span class="filter-label">关系：</span>
    <div id="rel-chips"></div>
    <label class="family-select-wrap" for="family-select">
      <span class="filter-label">亲缘谱系：</span>
      <select id="family-select" aria-label="选择直系亲缘家族"><option value="">加载家族候选…</option></select>
    </label>
  </div>

  <!-- 图例 -->
  <div id="legend"></div>

  <!-- 画布 -->
  <main id="container">
    <canvas id="graph"></canvas>
    <p id="loading">数据加载中…</p>
  </main>

  <!-- 详情面板 -->
  <aside id="detail" class="hidden" aria-live="polite">
    <button id="detail-close" type="button" aria-label="关闭">×</button>
    <div id="detail-body"></div>
  </aside>

  <!-- 悬浮提示 -->
  <div id="tooltip" class="hidden"></div>

  <script src="assets/vendor/d3-quadtree.min.js"></script>
  <script src="assets/vendor/d3-dispatch.min.js"></script>
  <script src="assets/vendor/d3-timer.min.js"></script>
  <script src="assets/vendor/d3-force.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
